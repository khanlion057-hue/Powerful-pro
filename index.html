<!-- v25.9 (PageSpeed 1-band): KIRISH OYNASI SKELETI — JS yuklanguncha (sekin internetda ~7 s) kirmagan foydalanuvchi bo'sh ilova
     qobig'ini emas, darhol kirish oynasini ko'radi (LCP — logotip birinchi chizishda). Markup showUnifiedLogin() bilan aynan bir xil
     (o'lcham va joy o'zgarmaydi — siljish yo'q); maydonlar o'chiq, tugma «Yuklanmoqda…». showUnifiedLogin() body'ni almashtiradi —
     skelet o'zi yo'qoladi. Faqat kirish aniq so'raladigan holatda ko'rinadi (main.js init bilan bir xil shart: sessiya belgisi,
     eslab qolish va tez kirish yo'q) — kirgan foydalanuvchida «Kirish» miltillamaydi. -->
<div id="fw-boot-login" class="fw-brand-bg" aria-busy="true" style="display:none;position:fixed;inset:0;z-index:9000;min-height:100vh;align-items:center;justify-content:center;padding:20px">
  <div class="fw-login-card" style="background:#fff;border-radius:18px;padding:36px 30px;width:100%;max-width:340px;box-shadow:0 14px 36px rgba(15,23,42,0.14);text-align:center">
    <div style="margin-bottom:22px"><span class="fw-lock lg on-light" role="img" aria-label="POWERFUL GROUP"><img src="assets/brand-logo.png" srcset="assets/brand-logo.webp" alt="POWERFUL GROUP" width="1044" height="674" fetchpriority="high" decoding="async" data-brand-logo onerror="if(this.getAttribute('srcset')){this.removeAttribute('srcset')}else{this.parentNode.classList.add('noimg')}"><b class="fw-lock-fb" data-brand-name>POWERFUL GROUP</b></span></div>
    <input disabled tabindex="-1" placeholder="Login" aria-hidden="true" style="width:100%;padding:13px 14px;font-size:14px;line-height:18px;border:1.5px solid #e1e6ed;border-radius:10px;margin-bottom:10px;outline:none;box-sizing:border-box;background:#fff">
    <div class="fw-pw-f" style="margin-bottom:14px"><input disabled tabindex="-1" type="password" placeholder="Parol" aria-hidden="true" style="width:100%;padding:13px 48px 13px 14px;font-size:14px;line-height:18px;border:1.5px solid #e1e6ed;border-radius:10px;outline:none;box-sizing:border-box;background:#fff"></div>
    <button type="button" disabled style="width:100%;padding:13px;line-height:18px;background:linear-gradient(135deg,#B8700C,#8A5208);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;opacity:.75">Yuklanmoqda…</button>
    <div style="font-size:12px;margin-top:8px;min-height:16px"></div>
    <button type="button" class="fw-forgot" disabled tabindex="-1" aria-hidden="true" style="visibility:hidden;line-height:18px">Parolni unutdingizmi?</button>
  </div>
</div>
<script>/* shared.js initTheme bilan bir xil: masshtab (sukut 90%) va mavzu — skelet keyingi formadan farq qilmasin */
try{var h=document.documentElement,z=parseInt(localStorage.getItem('fw_text_scale')||'90',10);if([80,90,100,110,120,130].indexOf(z)<0)z=90;if(z!==100)h.style.zoom=z/100;h.style.setProperty('--fw-z',String(z/100));
var m=localStorage.getItem('koma_theme')||'system',dk=m==='dark'||m==='oled'||m==='mono'||(m==='system'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);if(dk)h.setAttribute('data-theme','dark');if(m==='oled'||m==='mono'||m==='mono-light')h.setAttribute('data-variant',m);
if(sessionStorage.getItem('bp_auth_ok')!=='1'&&!localStorage.getItem('fw_remember_v1')&&!localStorage.getItem('fw_quick_v1'))document.getElementById('fw-boot-login').style.display='flex'}catch(e){}</script>
